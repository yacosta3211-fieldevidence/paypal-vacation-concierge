<script>
  // Load official PayPal + Venmo Sandbox JS SDK using the Client ID from /api/state
  async function initPayPalSmartButtons() {
    const res = await fetch('/api/state');
    const { paypal_client_id } = await res.json();
    if (!paypal_client_id || paypal_client_id === 'sb') return;

    const script = document.createElement('script');
    script.src = `https://www.paypal.com/sdk/js?client-id=${paypal_client_id}&currency=USD&enable-funding=venmo`;
    script.onload = () => {
      window.paypal.Buttons({
        createOrder: async () => {
          const response = await fetch('/api/paypal/create-order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              amount: currentState.last_known_price,
              order_type: 'HOTEL_BOOKING'
            })
          });
          const order = await response.json();
          return order.id;
        },
        onApprove: async (data) => {
          const capRes = await fetch(`/api/paypal/capture-order/${data.orderID}?order_type=HOTEL_BOOKING`, {
            method: 'POST'
          });
          const result = await capRes.json();
          updateUI(result.state);
          appendMessage(
            '✓ PayPal Sandbox Capture Complete',
            `Captured Order ${data.orderID} for $${currentState.last_known_price.toFixed(2)}!`,
            true
          );
        }
      }).render('#paypal-button-container');
    };
    document.body.appendChild(script);
  }

  initPayPalSmartButtons();
</script>
